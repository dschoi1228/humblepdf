[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
humblepdf-core = { path = "crates/core" }
lopdf = { version = "=0.47.0", default-features = false }
subsetter = { version = "=0.2.6", default-features = false }
ttf-parser = "=0.25.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
ts-rs = "=12.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-window-state = "=2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Keep unwinding (not "abort") so a panic inside a parser can be caught at the command boundary (SPEC 8).
strip = true

# Image decoding and PDF parsing are slow in debug builds; tests and the CLI run them a lot.
[profile.dev.package."*"]
opt-level = 2
